# Holt jeden Morgen die aktuellen Aktionen und veröffentlicht die Website auf GitHub Pages.
name: Aktionen aktualisieren

on:
  schedule:
    - cron: '17 4 * * *'   # täglich ca. 05:17/06:17 Schweizer Zeit
  workflow_dispatch:        # manuell starten über "Run workflow"
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Aktionen sammeln
        run: npm run scrape
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
